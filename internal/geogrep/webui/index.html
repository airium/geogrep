<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>geogrep web</title>
  <style>
    :root {
      --bg-0: #f2f6ef;
      --bg-1: #d6e7da;
      --panel: rgba(255, 255, 255, 0.92);
      --ink: #1f2a2d;
      --muted: #5a6b6d;
      --accent: #0f7b6c;
      --accent-2: #ee9b00;
      --border: #c5d6c9;
      --error: #9f2a2a;
      --ok: #1f6f3d;
      --shadow: 0 16px 42px rgba(33, 66, 52, 0.14);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: "IBM Plex Sans", "Noto Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 800px at 0% 0%, #f8ffef 0%, transparent 55%),
        radial-gradient(900px 700px at 100% 100%, #ebf2ff 0%, transparent 48%),
        linear-gradient(145deg, var(--bg-0), var(--bg-1));
      line-height: 1.45;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 42px;
      animation: rise 360ms ease-out;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 16px;
    }

    .hero h1 {
      margin: 0 0 4px;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      letter-spacing: 0.01em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 180px 1fr auto;
      gap: 10px;
      align-items: stretch;
    }

    .form-row > label {
      display: block;
      min-width: 0;
    }

    #lookup-value {
      width: 100%;
    }

    select,
    input,
    button,
    textarea {
      border-radius: 12px;
      border: 1px solid #bccdc1;
      font-size: 0.98rem;
      padding: 11px 12px;
      font-family: inherit;
      color: var(--ink);
      background: #fff;
    }

    select:focus,
    input:focus,
    button:focus,
    textarea:focus {
      outline: 2px solid rgba(15, 123, 108, 0.22);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    button {
      cursor: pointer;
      background: linear-gradient(160deg, var(--accent), #0a6558);
      color: #fff;
      border-color: transparent;
      font-weight: 700;
      min-width: 140px;
      transition: transform 140ms ease, filter 140ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    button:active {
      transform: translateY(0);
      filter: brightness(0.97);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .result-text {
      flex: 1 1 auto;
      min-width: 0;
    }

    .copy-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .copy-actions.hidden {
      display: none;
    }

    .copy-btn {
      min-width: 0;
      padding: 8px 10px;
      font-size: 0.85rem;
      background: linear-gradient(150deg, #2d7aa5, #275e80);
    }

    .status {
      margin: 0;
      min-height: 1.35em;
      font-size: 0.95rem;
    }

    .status.error {
      color: var(--error);
      font-weight: 600;
    }

    .status.ok {
      color: var(--ok);
      font-weight: 600;
    }

    .summary {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .cards li {
      border: 1px solid #d7e4db;
      border-radius: 12px;
      background: #fbfefc;
      padding: 10px 12px;
      font-size: 0.92rem;
      color: #334;
    }

    .cards b {
      display: block;
      margin-bottom: 4px;
      color: #233;
    }

    .expand-toggle {
      margin-top: 8px;
      background: transparent;
      color: #0e5fa4;
      border: 1px dashed #9cb7cc;
      min-width: 0;
      padding: 6px 8px;
      font-weight: 600;
      border-radius: 10px;
    }

    .extra-lines {
      display: none;
      margin-top: 8px;
      color: #334;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .extra-lines.open {
      display: block;
    }

    details {
      margin-top: 14px;
      border-top: 1px dashed #c7d8cb;
      padding-top: 12px;
    }

    summary {
      cursor: pointer;
      color: #294f55;
      font-weight: 600;
    }

    pre {
      margin: 10px 0 0;
      max-height: 420px;
      overflow: auto;
      background: #11171a;
      color: #d7e9f3;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .foot {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: right;
    }

    code {
      font-family: "IBM Plex Mono", "DejaVu Sans Mono", "SFMono-Regular", monospace;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 760px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .result-head {
        flex-direction: column;
      }

      .copy-actions {
        justify-content: flex-start;
      }

      button {
        width: 100%;
      }

      .wrap {
        padding: 16px 12px 28px;
      }

      .hero,
      .panel {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>geogrep web</h1>
      <p>Search geo databases from your browser with the same matching engine as <code>geogrep find</code>.</p>
    </section>

    <section class="panel">
      <form id="lookup-form" autocomplete="off">
        <div class="form-row">
          <label>
            <select id="lookup-type" name="type">
              <option value="auto">auto</option>
              <option value="ipv4">ipv4</option>
              <option value="ipv6">ipv6</option>
              <option value="domain">domain</option>
              <option value="keyword">keyword</option>
            </select>
          </label>
          <label>
            <input id="lookup-value" name="q" placeholder="Enter IP/CIDR/domain/keyword" required>
          </label>
          <button id="lookup-button" type="submit">Run Lookup</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="result-head">
        <div class="result-text">
          <p id="status" class="status"></p>
          <p id="summary" class="summary"></p>
        </div>
        <div id="copy-actions" class="copy-actions hidden">
          <button id="copy-share" class="copy-btn" type="button">Copy Share URL</button>
          <button id="copy-api" class="copy-btn" type="button">Copy API URL</button>
        </div>
      </div>
      <ul id="matches" class="cards"></ul>
      <details>
        <summary>Raw JSON response</summary>
        <pre id="raw-json">No request has been made yet.</pre>
      </details>
    </section>

    <p class="foot">geogrep embedded web UI</p>
  </main>

  <script>
    (function () {
      "use strict";

      var form = document.getElementById("lookup-form");
      var typeEl = document.getElementById("lookup-type");
      var valueEl = document.getElementById("lookup-value");
      var buttonEl = document.getElementById("lookup-button");
      var statusEl = document.getElementById("status");
      var summaryEl = document.getElementById("summary");
      var matchesEl = document.getElementById("matches");
      var rawEl = document.getElementById("raw-json");
      var copyActionsEl = document.getElementById("copy-actions");
      var copyShareEl = document.getElementById("copy-share");
      var copyAPIEl = document.getElementById("copy-api");

      var currentShareURL = "";
      var currentAPIURL = "";

      function sanitizeType(type) {
        if (["auto", "ipv4", "ipv6", "domain", "keyword"].indexOf(type) >= 0) {
          return type;
        }
        return "auto";
      }

      function buildAPIPath(type, value) {
        return "/api/find/" + type + "/" + encodeURIComponent(value);
      }

      function buildSharePath(type, value) {
        return "/find/" + type + "/" + encodeURIComponent(value);
      }

      function toAbsolute(pathname) {
        return window.location.origin + pathname;
      }

      function setLinks(type, value) {
        if (!value) {
          currentShareURL = "";
          currentAPIURL = "";
          return;
        }

        var sharePath = buildSharePath(type, value);
        var apiPath = buildAPIPath(type, value);
        currentShareURL = toAbsolute(sharePath);
        currentAPIURL = toAbsolute(apiPath);
      }

      function toggleCopyActions(show) {
        if (show) {
          copyActionsEl.classList.remove("hidden");
          return;
        }
        copyActionsEl.classList.add("hidden");
      }

      function flashButtonText(button, text, timeoutMs) {
        var original = button.textContent;
        button.textContent = text;
        window.setTimeout(function () {
          button.textContent = original;
        }, timeoutMs);
      }

      async function copyToClipboard(text) {
        if (!text) {
          return false;
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) {
        }

        try {
          var temp = document.createElement("textarea");
          temp.value = text;
          temp.setAttribute("readonly", "readonly");
          temp.style.position = "fixed";
          temp.style.opacity = "0";
          document.body.appendChild(temp);
          temp.focus();
          temp.select();
          var ok = document.execCommand("copy");
          document.body.removeChild(temp);
          return ok;
        } catch (_) {
          return false;
        }
      }

      function clearStatus() {
        statusEl.textContent = "";
        statusEl.className = "status";
      }

      function setStatus(message, kind) {
        statusEl.textContent = message;
        statusEl.className = "status" + (kind ? " " + kind : "");
      }

      function renderSummary(payload) {
        var results = payload && payload.result && payload.result.results;
        if (!Array.isArray(results) || results.length === 0) {
          summaryEl.textContent = "No result payload returned.";
          matchesEl.innerHTML = "";
          return;
        }

        var first = results[0] || {};
        var dbResults = Array.isArray(first.database_results) ? first.database_results : [];
        var matchedDB = 0;
        var totalMatches = 0;
        var cards = [];

        dbResults.forEach(function (db) {
          if (!db || !db.matched) {
            return;
          }
          matchedDB += 1;
          var dbMatches = Array.isArray(db.matches) ? db.matches : [];
          totalMatches += dbMatches.length;

          var lines = dbMatches.slice(0, 3).map(function (m) {
            var sub = m.sub_entry ? m.sub_entry + " | " : "";
            return escapeHTML(sub + m.rule);
          });

          var extraLines = dbMatches.slice(3).map(function (m) {
            var sub = m.sub_entry ? m.sub_entry + " | " : "";
            return escapeHTML(sub + m.rule);
          });

          var extra = "";
          if (extraLines.length > 0) {
            extra = "<div>" +
              "<button type=\"button\" class=\"expand-toggle\" data-more-text=\"+" + extraLines.length + " more\">+" + extraLines.length + " more</button>" +
              "<div class=\"extra-lines\">" + extraLines.join("<br>") + "</div>" +
            "</div>";
          }

          cards.push(
            "<li>" +
              "<b>" + escapeHTML(db.database || "(unknown database)") + "</b>" +
              "<div>matches: " + dbMatches.length + "</div>" +
              (lines.length ? "<div>" + lines.join("<br>") + "</div>" : "") +
              extra +
            "</li>"
          );
        });

        summaryEl.textContent = "Matched " + matchedDB + " database(s), total " + totalMatches + " rule match(es).";
        matchesEl.innerHTML = cards.join("");
      }

      function clearResultArea() {
        summaryEl.textContent = "";
        matchesEl.innerHTML = "";
        toggleCopyActions(false);
      }

      function escapeHTML(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      async function runLookup(shouldUpdateHistory) {
        clearStatus();

        var type = sanitizeType(typeEl.value);
        var value = valueEl.value.trim();
        setLinks(type, value);
        toggleCopyActions(false);

        if (!value) {
          setStatus("Input is required.", "error");
          clearResultArea();
          rawEl.textContent = "No request has been made yet.";
          return;
        }

        if (shouldUpdateHistory) {
          var query = "?type=" + encodeURIComponent(type) + "&q=" + encodeURIComponent(value);
          window.history.replaceState(null, "", "/" + query);
        }

        var apiPath = buildAPIPath(type, value);
        setStatus("Looking up...", "");
        buttonEl.disabled = true;

        try {
          var response = await fetch(apiPath, { method: "GET", headers: { "Accept": "application/json" } });
          var payload = await response.json();
          rawEl.textContent = JSON.stringify(payload, null, 2);

          if (!response.ok) {
            var msg = payload && payload.error ? payload.error : "Request failed";
            setStatus("Lookup failed: " + msg, "error");
            clearResultArea();
            return;
          }

          setStatus("Lookup succeeded.", "ok");
          renderSummary(payload);
          toggleCopyActions(true);
        } catch (err) {
          rawEl.textContent = "";
          clearResultArea();
          setStatus("Network error: " + (err && err.message ? err.message : String(err)), "error");
        } finally {
          buttonEl.disabled = false;
        }
      }

      matchesEl.addEventListener("click", function (event) {
        var toggle = event.target.closest(".expand-toggle");
        if (!toggle) {
          return;
        }
        var wrapper = toggle.parentElement;
        if (!wrapper) {
          return;
        }
        var lines = wrapper.querySelector(".extra-lines");
        if (!lines) {
          return;
        }

        var open = lines.classList.toggle("open");
        if (open) {
          toggle.textContent = "Show less";
        } else {
          toggle.textContent = toggle.getAttribute("data-more-text") || "+more";
        }
      });

      copyShareEl.addEventListener("click", async function () {
        var ok = await copyToClipboard(currentShareURL);
        flashButtonText(copyShareEl, ok ? "Copied" : "Copy failed", 1200);
      });

      copyAPIEl.addEventListener("click", async function () {
        var ok = await copyToClipboard(currentAPIURL);
        flashButtonText(copyAPIEl, ok ? "Copied" : "Copy failed", 1200);
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        runLookup(true);
      });

      (function bootFromURL() {
        var params = new URLSearchParams(window.location.search);
        var urlType = sanitizeType(params.get("type") || "auto");
        var urlValue = (params.get("q") || "").trim();

        typeEl.value = urlType;
        valueEl.value = urlValue;
        setLinks(urlType, urlValue);

        if (urlValue) {
          runLookup(false);
        }
      })();
    })();
  </script>
</body>
</html>
